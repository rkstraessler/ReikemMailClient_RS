name: CI

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: '-D warnings'

jobs:
  rust:
    name: Rust verification
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve locked dependencies
        run: cargo +stable fetch --locked
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable check --locked --all-targets --all-features
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --all-features
      - run: cargo +stable build --locked --all-features
      - run: cargo +stable doc --locked --no-deps
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit@0.23.0
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          version=1.7.12
          checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Test the Dependabot eligibility policy
        run: bash .github/scripts/test-dependabot.sh

  msrv:
    name: Rust 1.88 compatibility
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --all-targets --all-features
      - name: Resolve and check the SDK as a dependency
        shell: bash
        run: |
          consumer=$(mktemp -d)
          mkdir "$consumer/src"
          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "sdk-consumer"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.88"
          [dependencies]
          reikem-mail-client = { path = "$GITHUB_WORKSPACE" }
          EOF
          printf '%s\n' 'fn main() { assert!(reikem_mail_client::MailStatus::is_known("queued")); }' > "$consumer/src/main.rs"
          cargo +1.88.0 run --manifest-path "$consumer/Cargo.toml"

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  required:
    name: Required CI
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [rust, msrv, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      RUST_RESULT: ${{ needs.rust.result }}
      MSRV_RESULT: ${{ needs.msrv.result }}
      DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
    steps:
      - shell: bash
        run: |
          test "$RUST_RESULT" = success
          test "$MSRV_RESULT" = success
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              test "$DEPENDENCY_RESULT" = success
          fi
